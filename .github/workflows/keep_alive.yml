name: Keep Streamlit App Awake 24/7 (Headless Browser)

on:
  schedule:
    # Runs every 3 hours (8 times a day)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Playwright Keep-Alive and Auto-Wake Script
        run: |
          python scripts/keep_alive_playwright.py
